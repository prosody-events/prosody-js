[package]
edition = "2024"
name = "prosody-codec-bench"
publish = false
version = "0.0.0"

# Own workspace root: this crate is a benchmark harness, deliberately kept out
# of the published `prosody-js` package.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
mimalloc = { version = "0.1", features = ["local_dynamic_tls", "v2"] }
napi = { version = "3.8", features = ["napi9", "serde-json"] }
napi-derive = "3.5"
prosody = { version = "0.5.0", features = ["libz-static"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.2"

# Mirrors the production profile: `lto = "fat"` and one codegen unit change how
# aggressively the serde_json tree walk inlines, so a benchmark built without
# them would not measure the shipped code.
[profile.release]
codegen-units = 1
lto = "fat"
