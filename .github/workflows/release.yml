name: Release

env:
  DEBUG: "napi:*"
  APP_NAME: prosody
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write
  pull-requests: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      retry_version:
        description: "Rebuild and publish the current version without running Release Please"
        required: false
        type: string
      release_as:
        description: "Force release version (e.g. 2.2.0-beta.1)"
        required: false
        type: string

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release_context.outputs.release_created }}
    steps:
      - uses: actions/checkout@v6
      - name: Release Please Action
        if: inputs.retry_version == ''
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GH_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ github.event.inputs.release_as }}

      - name: Resolve release context
        id: release_context
        env:
          RETRY_VERSION: ${{ inputs.retry_version }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
        run: |
          if [[ -n "$RETRY_VERSION" ]]; then
            package_version=$(node -p "require('./package.json').version")
            if [[ "$RETRY_VERSION" != "$package_version" ]]; then
              echo "::error::Retry version $RETRY_VERSION does not match package version $package_version"
              exit 1
            fi
            release_created=true
          else
            release_created=${RELEASE_CREATED:-false}
          fi

          echo "release_created=$release_created" >> "$GITHUB_OUTPUT"

  build:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          # Native builds
          - target: aarch64-apple-darwin
            host: macos-latest
          - target: x86_64-pc-windows-msvc
            host: windows-latest
          # Linux Docker builds
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
            use_docker: true
            rustflags: -C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-latest
            use_docker: true
            rustflags: ""
    name: ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      # Native builds (macOS/Windows)
      - uses: actions/checkout@v6
        if: ${{ !matrix.settings.use_docker }}

      - name: Setup node
        if: ${{ !matrix.settings.use_docker }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - name: Install Rust
        if: ${{ !matrix.settings.use_docker }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        if: ${{ !matrix.settings.use_docker }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            ./target
          key: ${{ matrix.settings.target }}-cargo-cache
      - name: Install protobuf compiler
        if: ${{ !matrix.settings.use_docker }}
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "25.9"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        if: ${{ !matrix.settings.use_docker }}
        run: yarn install
      - name: Build
        if: ${{ !matrix.settings.use_docker }}
        run: yarn build --target ${{ matrix.settings.target }}

      # Docker builds (Linux)
      - uses: actions/checkout@v6
        if: ${{ matrix.settings.use_docker }}
      - name: Set up Docker Buildx
        if: ${{ matrix.settings.use_docker }}
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build in Docker
        if: ${{ matrix.settings.use_docker }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: .github/docker/linux-release.Dockerfile
          target: artifact
          build-args: |
            RUST_TARGET=${{ matrix.settings.target }}
            RUSTFLAGS=${{ matrix.settings.rustflags }}
          outputs: type=local,dest=.
          cache-from: type=gha,scope=linux-${{ matrix.settings.target }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.settings.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            ${{ env.APP_NAME }}.*.node
            bindings.js
            bindings.d.ts
          if-no-files-found: error

  test-linux-bindings:
    name: test-${{ matrix.target }}-node@${{ matrix.node }}
    needs: [build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
        node: ["24"]
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.target }}
          path: .

      # Set up Kafka and Cassandra services
      - name: Create Docker network
        run: docker network create kafka-test-network

      - name: Start Cassandra container
        run: |
          docker run -d --name cassandra --network kafka-test-network \
            -p 9042:9042 \
            cassandra:latest

      - name: Start Kafka container
        run: |
          docker run -d --name kafka --network kafka-test-network \
            -e KAFKA_NODE_ID=0 \
            -e KAFKA_PROCESS_ROLES=controller,broker \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093 \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            apache/kafka:latest

      - name: Wait for services to be ready
        run: |
          echo "Waiting for Cassandra and Kafka to be ready..."

          # Wait for Cassandra
          for i in {1..60}; do
            if docker exec cassandra cqlsh -e "SELECT cluster_name FROM system.local;" >/dev/null 2>&1; then
              echo "✅ Cassandra is ready after ${i} attempts"
              break
            elif [ $i -eq 60 ]; then
              echo "❌ Cassandra failed to start after 60 seconds"
              docker logs cassandra
              exit 1
            else
              echo "⏳ Cassandra attempt $i: not ready yet..."
              sleep 1
            fi
          done

          # Wait for Kafka
          for i in {1..60}; do
            if docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "✅ Kafka is ready after ${i} attempts"
              break
            elif [ $i -eq 60 ]; then
              echo "❌ Kafka failed to start after 60 seconds"
              docker logs kafka
              exit 1
            else
              echo "⏳ Kafka attempt $i: not ready yet..."
              sleep 1
            fi
          done

          echo "🎉 Both services are ready!"

      # Run tests in Docker
      - name: Test bindings
        run: |
          docker run --rm --network kafka-test-network \
            -e PROSODY_BOOTSTRAP_SERVERS=kafka:9092 \
            -e PROSODY_CASSANDRA_NODES=cassandra:9042 \
            -e PROSODY_CASSANDRA_KEYSPACE=prosody_test \
            -v ${{ github.workspace }}:/build -w /build \
            node:${{ matrix.node }}-bookworm \
            sh -c "yarn install && yarn test"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    needs:
      - release-please
      - build
      - test-linux-bindings
    if: ${{ needs.release-please.outputs.release_created }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: yarn
      - name: Install dependencies
        run: yarn install
      - name: Download bindings js and types
        uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .
          pattern: "bindings.*"
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Move artifacts
        run: yarn artifacts
      - name: Publish
        run: npm publish --provenance --access public
