name: Release Build Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/docker/**
      - .github/workflows/release.yml
      - .github/workflows/release-validation.yml
      - .yarn/**
      - .yarnrc.yml
      - Cargo.lock
      - Cargo.toml
      - package.json
      - yarn.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build ${{ matrix.target.rust }} release artifact
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - rust: x86_64-unknown-linux-gnu
            rustflags: -C link-arg=-fuse-ld=mold
          - rust: aarch64-unknown-linux-gnu
            rustflags: ""
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build release artifact
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/docker/linux-release.Dockerfile
          target: artifact
          build-args: |
            RUST_TARGET=${{ matrix.target.rust }}
            RUSTFLAGS=${{ matrix.target.rustflags }}
          outputs: type=local,dest=artifacts/${{ matrix.target.rust }}
          cache-from: type=gha,scope=linux-${{ matrix.target.rust }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.target.rust }}
